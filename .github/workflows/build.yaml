name: Build

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: NPM Install
        run: npm install

      - name: Docker Build and Push
        run: |
          docker build -t swiggy-clone .
          docker tag swiggy-clone santhanamarig/docker-hub-repository-swiggy:latest
          echo "${{ secrets.Dockerhub_token }}" | docker login --username "${{ secrets.Dockerhub_username }}" --password-stdin
          docker push santhanamarig/docker-hub-repository-swiggy:latest

  deploy:
    name: Deploy
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Pull Image
        run: docker pull santhanamarig/docker-hub-repository-swiggy:latest

      - name: Image Scan
        run: |
          trivy image --scanners vuln --timeout 15m \
            --severity HIGH,CRITICAL \
            santhanamarig/docker-hub-repository-swiggy:latest > trivyimagedeploy.txt
          cat trivyimagedeploy.txt

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ap-south-1 --name EKS_CLOUD

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment-service.yml
          kubectl rollout restart deployment/swiggy-clone
          kubectl rollout status deployment/swiggy-clone --timeout=180s
